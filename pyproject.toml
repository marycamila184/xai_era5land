[project]
name = "xai-era5land"
version = "0.1.0"
description = "ERA5-Land precipitation prediction with explainable ML"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Osmary Camila Bortoncello Glober" },
    { name = "Vitor Gabriel Pignatari Israel Matias" },
    { name = "Anderson Ara" },
]
dependencies = [
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "dask>=2024.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
